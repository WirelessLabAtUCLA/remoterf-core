name: Dev smoke test

# Client -> dev Global -> test lab, over the internet from a GitHub-hosted runner.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dev-vps
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WirelessLabAtUCLA/remoterf-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./client
      - run: python tools/dev-smoke/dev_smoke.py
        env:
          REMOTERF_GLOBAL_ORIGIN: https://dev.global.remoterf.net
          RRF_SMOKE_USER: ci-smoke
          RRF_SMOKE_USER2: ci-smoke-2
          RRF_SMOKE_PASSWORD: ${{ secrets.DEV_SMOKE_PASSWORD }}
          DEV_SMOKE_RESULT: ${{ runner.temp }}/dev-smoke-result.json
          # No dev lease here (the gate leases issue-N only): skip logout, which would end a PR run's sessions.
          DEV_SMOKE_UNLEASED: "1"
