name: Free dev (PR closed)

# Frees the dev lease (spec 3.6) when an issue-* PR closes, merged or not.
# No environment: GitHub checks env branch policies against refs/pull/N/merge here, which
# issue-* never matches. DEV_RELEASE_KEY is a repo secret whose dev key may only run `release`.
on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: startsWith(github.head_ref, 'issue-') && vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.DEV_RELEASE_KEY }}
          KNOWN: ${{ vars.DEV_KNOWN_HOSTS }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.event.repository.name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@dev.global.remoterf.net release "$BRANCH" "$REPO"
