name: dev-release

# Frees the dev lease (spec 3.6) when an issue-* PR closes, merged or not.
on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: startsWith(github.head_ref, 'issue-') && vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - env:
          KEY: ${{ secrets.DEV_DEPLOY_KEY }}
          KNOWN: ${{ vars.DEV_KNOWN_HOSTS }}
          BRANCH: ${{ github.head_ref }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@dev.global.remoterf.net release "$BRANCH"
