syntax = "proto3";

package remoterf;

import "grpc.proto"; // package remote_rf; GenericRPCRequest/Response

message HostHello {
  string host_id = 1;
  string version = 2;
  string host_token = 3;
}

message DeviceInfo {
  uint32 local_id = 1;
  string label = 2;
  string device_id = 3;
  string serial = 4;
  string kind = 5;
  string handle = 6;
}

message DeviceAnnounce {
  repeated DeviceInfo devices = 1;
  uint64 unix_ms = 2;
  bool full_snapshot = 3;
}

message RpcRequest {
  string req_id = 1;
  uint32 global_device_id = 2;
  uint32 local_device_id = 3;
  string device_id = 4;
  remote_rf.GenericRPCRequest request = 5;
  uint64 deadline_unix_ms = 6;
}

message RpcResponse {
  string req_id = 1;
  bool ok = 2;
  remote_rf.GenericRPCResponse response = 3;
  string error = 4;
}

message Heartbeat {
  uint64 unix_ms = 1;
}

message Cancel {
  string req_id = 1;
}

/* ---------------------------
 * NEW: server-pull metadata
 * ---------------------------
 */

message MetaRequest {
  string req_id = 1;

  bool include_platform = 2;
  bool include_env = 3;
  bool include_devices = 4;
}

message HostMeta {
  string host_id = 1;
  string version = 2;
  uint64 unix_ms = 3;

  // safe key/value metadata (allowlisted by host)
  map<string, string> kv = 4;

  // optional device snapshot
  repeated DeviceInfo devices = 5;
}

message MetaResponse {
  string req_id = 1;
  bool ok = 2;
  string error = 3;
  HostMeta meta = 4;
}

message HostFrame {
  oneof msg {
    HostHello hello = 1;
    DeviceAnnounce device_announce = 2;

    RpcRequest rpc_request = 3;
    RpcResponse rpc_response = 4;

    Heartbeat heartbeat = 5;
    Cancel cancel = 6;

    // NEW
    MetaRequest meta_request = 7;
    MetaResponse meta_response = 8;
  }
}

service HostTunnel {
  rpc Connect(stream HostFrame) returns (stream HostFrame);
}