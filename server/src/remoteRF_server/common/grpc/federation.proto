syntax = "proto3";
package remote_rf;
import "grpc.proto";

// Generic Gate E action transport. Authorization remains destination-local.
service FederationV2 {
  rpc Execute (FederationRequest) returns (FederationResponse);
}

message FederationRequest {
  string protocol_version = 1;
  string grant = 2;
  string request_json = 3;
  bytes frame = 4;            // raw GenericRPCRequest when request_json is detached; else empty
  bool accept_detached = 5;   // requester can take a detached result + frame
}

message FederationResponse {
  string protocol_version = 1;
  string signed_result = 2;
  ErrorEnvelope error = 3;
  bytes frame = 4;            // raw GenericRPCResponse when signed_result is detached; else empty
}
