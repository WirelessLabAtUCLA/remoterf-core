name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test_protected_proto_bytes reads an old commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install . pytest
      - run: pytest tests --ignore-glob='*hardware*' -q
        env:
          GRPC_PORT: "50051"
          CERT_PORT: "50052"
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_DATA_HOME: ${{ runner.temp }}/data
